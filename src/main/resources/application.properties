# =====================================================================
# Ant farm simulation — base configuration (all profiles)
# =====================================================================
spring.application.name=antfarm

# ---------------------------------------------------------------------
# Datasource — matches compose.yaml (db/user/password: antfarm).
# Override per environment (CI, prod) via SPRING_DATASOURCE_* env vars.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/antfarm
spring.datasource.username=antfarm
spring.datasource.password=antfarm

# ---------------------------------------------------------------------
# Flyway — schema lives in src/main/resources/db/migration.
# The Modulith outbox table (event_publication) will be created by the
# first migration (M1); until then Hibernate auto-DDL (update) keeps the
# demo runnable. Revisit: validate + migrations only once M1 lands.
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update

# One transaction per use case / tick; never hold a session across the
# web request (loads aggregate graphs explicitly in repositories).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.timeout=10

# Keep SQL out of the logs by default; flip in a dev profile when needed.
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Actuator / observability
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
# Liveness/readiness probes for container orchestration
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------
# Simulation engine — bound to SimulationProperties (simulation module)
# ---------------------------------------------------------------------
# 10 ticks per second
simulation.tick-interval-ms=100
simulation.random-seed=20260902
simulation.world.width=120
simulation.world.height=80
simulation.world.branches=45
simulation.world.pebbles=30
simulation.colony.initial-food=250
simulation.colony.egg-cost=6
simulation.colony.egg-ticks=70
simulation.colony.brood-cap=12
simulation.colony.lay-cooldown-ticks=40
simulation.colony.initial-workers=10
simulation.colony.initial-foragers=8
simulation.ant.start-energy=100
simulation.ant.outside-cost=0.18
simulation.ant.inside-cost=0.04
simulation.ant.eat-threshold=35
simulation.ant.meal-amount=70
simulation.ant.leave-threshold=90
simulation.ant.leave-interval-ticks=25
simulation.ant.min-explore-ticks=60
simulation.ant.max-explore-ticks=400
simulation.ant.carrying-capacity=20
simulation.ant.sniff-radius=18
simulation.ant.dig-probability=0.008
simulation.ant.dig-cost=0.6
simulation.food.max-sources=10
simulation.food.spawn-interval-ticks=60
simulation.food.min-amount=15
simulation.food.max-amount=45
simulation.predators.bird-count=2
simulation.predators.hunt-interval-ticks=140
simulation.predators.hunt-radius=8
simulation.predators.move-every-ticks=2

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example.antfarm=DEBUG
