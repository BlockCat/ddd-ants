# =====================================================================
# Test configuration — in-memory H2, so module/integration tests run
# without an external PostgreSQL (or a container runtime).
# =====================================================================
spring.datasource.url=jdbc:h2:mem:antfarm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No migrations in the repo; let Hibernate create/drop the schema per test
# context (including the Modulith event_publication outbox table).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Keep the web layer happy without real SSE clients during tests.
spring.jpa.open-in-view=false
